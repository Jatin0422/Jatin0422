name: Generate Contribution Flow

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Jatin0422
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF4D6D&color_dots=%230D1117,%237A183D,%23A61E4D,%23FF4D6D,%23FF8FAB
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF4D6D&color_dots=%230D1117,%237A183D,%23A61E4D,%23FF4D6D,%23FF8FAB

      - name: Publish contribution animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update contribution flow"
